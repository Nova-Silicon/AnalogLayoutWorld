[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "analoglayoutworld"
version = "1.0.0a1"
description = "Fixed-netlist analog layout tasks and independent physical/electrical evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license-files = ["LICENSE", "LICENSING.md", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]

[project.urls]
Paper = "https://arxiv.org/abs/2611.16991"
Repository = "https://github.com/Nova-Silicon/AnalogLayoutWorld"

[project.optional-dependencies]
harbor = ["harbor==0.24.0"]

[project.scripts]
alw = "analoglayoutworld.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/analoglayoutworld", "src/eda", "src/analoglayoutworld_agents"]


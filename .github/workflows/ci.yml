name: release-contract
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python scripts/check_wheel.py dist/*.whl
      - run: python -m unittest discover -s tests
      - run: python scripts/check_release.py --require-pinned-image
  harbor-schema:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[harbor]'
      - run: python -m unittest discover -s tests -p test_release_contract.py
      - run: python -m unittest discover -s tests -p test_harbor_launcher.py
      - run: python -m unittest discover -s tests -p '*adapter.py'
      - run: python -m unittest discover -s tests -p test_image_workflow.py
